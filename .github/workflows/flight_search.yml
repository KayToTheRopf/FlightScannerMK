name: "✈️ Automatische Flugpreis-Suche (2x täglich)"

on:
  schedule:
    # Läuft 2x täglich: um 07:00 UTC (08:00/09:00 DE-Zeit) und 18:00 UTC (19:00/20:00 DE-Zeit)
    - cron: "0 7,18 * * *"
  workflow_dispatch: # Erlaubt jederzeit manuellen Start per Klick in GitHub

permissions:
  contents: write
  issues: write

jobs:
  search-bargains:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Flugschnäppchen ab MUC & FMM suchen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.run_search

      - name: Aktualisierte Preishistorie speichern (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update flight price history [skip ci]"
            git push
          fi
